<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tickets & Notes CSV Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui;
      background: radial-gradient(circle at top, #052e16, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0f0d;
    }

    .container {
      width: 700px;
      max-width: 95%;
      max-height: 90vh;
      overflow: hidden;
      background: rgba(2, 6, 23, 0.92);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(34, 197, 94, 0.15);
    }

    h2 {
      text-align: center;
      margin: 0 0 8px;
      color: #22c55e;
    }

    p {
      text-align: center;
      font-size: 13px;
      color: #a7f3d0;
      margin-bottom: 10px;
    }

    /* Textarea */
    textarea {
      width: 100%;
      height: 280px;
      padding: 14px;
      background: #020617;
      color: #ecfdf5;
      border-radius: 12px;
      border: 1px solid #14532d;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      transition: 0.25s;
    }

    textarea::placeholder {
      color: #4ade80;
      opacity: 0.6;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #022c22;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      margin-top: 6px;
      color: #86efac;
    }

    .error {
      text-align: center;
      font-size: 13px;
      color: #f87171;
      min-height: 18px;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-buttons button {
      padding: 6px;
      font-size: 13px;
      opacity: 0.6;
    }

    .active {
      opacity: 1 !important;
    }

    .hint {
      font-size: 12px;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.2);
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* NVIDIA green glow */
    .glow-card {
      background: #0b0f0d;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 0 12px rgba(118, 255, 3, 0.25);
      transition: all 0.3s ease;
    }

    .glow-card:hover {
      box-shadow:
        0 0 15px rgba(118, 255, 3, 0.5),
        0 0 30px rgba(118, 255, 3, 0.35);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <canvas id="matrix"></canvas>
  <div class="glow-card">
    <div class="container">

      <div class="tab-buttons">
        <button id="tabTicket" onclick="showTab('ticket')">Tickets</button>
        <button id="tabNotes" onclick="showTab('notes')">Notes</button>
      </div>

      <!-- TICKETS -->
      <div id="ticketSection">
        <h2>Ticket → CSV Generator</h2>

        <p>Paste tickets (Ctrl + Enter)</p>

        <div class="hint">
Paste tickets in this format and press ctrl + enter to download csv:
        </div>

        <textarea id="inputData" placeholder=
"Ticket ID: mw123456
Ticket URL: https://helpdesk.milesweb.com/en/admin/ticket/view/mw123456
Ticlket Issue: 
Action Taken: "></textarea>

        <div id="counter" class="footer">Tickets detected: 0</div>
        <div id="errorBox" class="error"></div>

        <button onclick="downloadCSV()">Download CSV</button>
      </div>

      <!-- NOTES -->
      <div id="notesSection" style="display:none;">
        <h2>Notes → CSV Generator</h2>

        <p>Paste Tasks (Ctrl + Enter)</p>

        <div class="hint">
          Paste tasks in this format and press ctrl + enter to download csv:
        </div>

        <textarea id="notesInput" placeholder=
"Monitored server
Checked CPU usage

Cleared mail queue
Resolved pending mails"></textarea>

        <div id="notesCounter" class="footer">Notes detected: 0</div>
        <div id="notesError" class="error"></div>

        <button onclick="downloadNotesCSV()">Download CSV</button>
      </div>

    </div>
  </div>

  <script>

    /* STORAGE */
    const STORAGE_KEY = "ticket_csv_draft";
    const NOTES_KEY = "notes_csv_draft";
    const TAB_KEY = "active_tab";

    /* ELEMENTS */
    const textarea = document.getElementById("inputData");
    const notesInput = document.getElementById("notesInput");

    /* TAB */
    function showTab(tab) {
      localStorage.setItem(TAB_KEY, tab);

      document.getElementById("ticketSection").style.display =
        tab === "ticket" ? "block" : "none";

      document.getElementById("notesSection").style.display =
        tab === "notes" ? "block" : "none";

      document.getElementById("tabTicket").classList.remove("active");
      document.getElementById("tabNotes").classList.remove("active");

      document.getElementById(tab === "ticket" ? "tabTicket" : "tabNotes").classList.add("active");
    }

    /* LOAD */
    window.onload = () => {
      showTab(localStorage.getItem(TAB_KEY) || "ticket");

      if (localStorage.getItem(STORAGE_KEY)) {
        textarea.value = localStorage.getItem(STORAGE_KEY);
        textarea.dispatchEvent(new Event("input"));
      }

      if (localStorage.getItem(NOTES_KEY)) {
        notesInput.value = localStorage.getItem(NOTES_KEY);
        notesInput.dispatchEvent(new Event("input"));
      }
    };

    /* TICKETS */
    textarea.addEventListener("input", () => {
      localStorage.setItem(STORAGE_KEY, textarea.value);

      let lines = textarea.value.split(/\n/).filter(l => l.trim());
      document.getElementById("counter").textContent =
        "Tickets detected: " + Math.floor(lines.length / 4);
    });

    textarea.addEventListener("keydown", e => {
      if (e.ctrlKey && e.key === "Enter") downloadCSV();
    });

    function downloadCSV() {
      let lines = textarea.value.split(/\n/).filter(l => l.trim());
      let csv = "ticket_id,url,issue,action\n";

      for (let i = 0; i < lines.length; i += 4) {
        csv += `"${lines[i]}","${lines[i + 1]}","${lines[i + 2]}","${lines[i + 3]}"\n`;
      }

      download(csv, "tickets");

      textarea.value = "";
      localStorage.removeItem(STORAGE_KEY);
    }

    /* NOTES */
    notesInput.addEventListener("input", () => {
      localStorage.setItem(NOTES_KEY, notesInput.value);
      let count = parseNotes(notesInput.value).length;
      document.getElementById("notesCounter").textContent = "Notes detected: " + count;
    });

    notesInput.addEventListener("keydown", e => {
      if (e.ctrlKey && e.key === "Enter") downloadNotesCSV();
    });

    // NEW: Regex-powered smart parser for '>>', '>', and multi-line formats
    function parseNotes(text) {
      let rawLines = text.split(/\n/).filter(l => l.trim());
      let parsedNotes = [];

      for (let i = 0; i < rawLines.length; i++) {
        let line = rawLines[i].trim();

        // Regex checks if the line contains '>>' or '>' 
        // match[1] will be the Title, match[2] is the separator, match[3] is the Description
        let match = line.match(/^(.*?)(>>|>)(.*)$/);

        if (match) {
          // Pattern 1: Inline separator was found
          let title = match[1].trim();
          let desc = match[3].trim();
          parsedNotes.push({ title, desc });
        }
        else {
          // Pattern 2: Multi-line fallback
          let title = line;
          let desc = "";

          // Check if the next line exists
          if (i + 1 < rawLines.length) {
            let nextLine = rawLines[i + 1].trim();

            // Ensure the next line isn't actually a new inline note
            let nextMatch = nextLine.match(/^(.*?)(>>|>)(.*)$/);
            if (!nextMatch) {
              desc = nextLine;
              i++; // Skip the next line since we're using it as the description
            }
          }
          parsedNotes.push({ title, desc });
        }
      }
      return parsedNotes;
    }

    function downloadNotesCSV() {
      let notes = parseNotes(notesInput.value);

      if (notes.length === 0) {
        document.getElementById("notesError").textContent = "No valid notes found.";
        return;
      }

      let csv = "title,description\n";

      notes.forEach(note => {
        // Escape quotes to prevent CSV formatting issues
        let safeTitle = note.title.replace(/"/g, '""');
        let safeDesc = note.desc.replace(/"/g, '""');
        csv += `"${safeTitle}","${safeDesc}"\n`;
      });

      download(csv, "notes");

      // Clean up after download
      notesInput.value = "";
      localStorage.removeItem(NOTES_KEY);
      document.getElementById("notesError").textContent = "";
      document.getElementById("notesCounter").textContent = "Notes detected: 0";
    }

    /* COMMON */
    function download(data, name) {
      let blob = new Blob([data], { type: "text/csv" });
      let url = URL.createObjectURL(blob);

      let a = document.createElement("a");
      a.href = url;
      a.download = `${name}_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();

      URL.revokeObjectURL(url);
    }

    /* MATRIX */
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "01";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#76ff03";
      ctx.font = fontSize + "px monospace";

      drops.forEach((y, i) => {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, y * fontSize);

        if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }

    setInterval(draw, 33);

  </script>

</body>

</html>
